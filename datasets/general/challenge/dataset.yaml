schema_version: 1
series_id: general-challenge
task_id_prefix: general_challenge_
task_root: tasks/general/challenge
workspace_root: workspace/general/challenge
source_registry: datasets/general/challenge/task_sources.yaml
capability_map: datasets/general/challenge/checkpoint_capability_map7.yaml
required_tags:
- custom
- general-challenge
exclude_tags:
- invalid
categories:
  office_documents:
    name: 文档与办公交付
    description: 多文档修订、原生办公产物和业务交接；不以自由闲聊为主。
  data_analysis:
    name: 数据分析与表格建模
    description: 清洗、核算、公式模型与可复算结论；运行脚本只是实现手段。
  research_verification:
    name: 研究检索与证据核验
    description: 发现并核对来源、版本、口径和结论；不是简单搜索摘要。
  file_operations:
    name: 文件与本地资源管理
    description: 文件树、归档、恢复和可验证变更；清理题仅产出计划。
  software_engineering:
    name: 软件工程与故障修复
    description: 代码或软件配置为主要交付，覆盖调试、测试、兼容和一致性。
  planning_coordination:
    name: 规划决策与项目协作
    description: 目标、约束、依赖和资源驱动的行动计划；包含一题学习规划。
  content_operations:
    name: 内容创作与运营
    description: 基于事实材料的改写、策划和多渠道交付；不单设抽象创意类。
task_id_style: category_directory
category_directories:
  01_Office_Documents: office_documents
