# WildClawBench 检查点 → 7 维能力映射（checkpoint_capability_map7）
#
# 结构：{task_id: {checkpoint_key: [维度标签, ...]}}，每个检查点 1~2 个维度。
# 7 维：code_generation 代码生成 / tool_use 工具调用 / data_processing 数据处理 /
#       retrieval_verification 检索验证 / reasoning_planning 推理规划 /
#       content_generation 内容生成 / verification_delivery 验证交付
# 边界：
#   code_generation：生成、修改并保证代码、脚本或配置逻辑正确；不把“运行测试后的结果”单独算作工具调用。
#   tool_use：选择并实际调用外部工具/API，或安全地执行文件、网络、消息、日历等操作；仅有文件/schema 结果不算工具调用。
#   data_processing：从已给定数据或材料中提取、清洗、转换、计算、对齐；不包含来源发现和权威性判断。
#   retrieval_verification：搜索或检索信息，选择/核实来源，并让证据可追溯；交付前自检不属于该维度。
#   reasoning_planning：理解约束、消解冲突、制定步骤、判断取舍和安全边界。
#   content_generation：生成文字、视觉、音视频等内容，并保证表达与创作质量。
#   verification_delivery：检查最终产物的存在性、结构、格式、完整性、可运行性和交付可用性；来源核实不属于该维度。
# 判据：以检查点实际观测到的信号为准，而不是任务所属分类或完成任务时可能使用的手段；
#       该检查点失分时最能说明模型缺什么能力。检索验证与验证交付不得共用同一检查点，复合检查点应先拆分。
# 特例：LLM 裁判单分制任务（04 套件、02_task_6）无检查点明细，映射键为 overall_score。
# v2 分离格式任务（有 ## LLM Judge Rubric 段）：检查点键带来源前缀——规则项
#   `automated.<key>`，LLM 项 `llm_judge.<canonical_key>`（rubric 里显式声明的稳定 key）。
#   映射时直接引用带前缀的键即可（键由作者定义、框架强制对齐，不会因 judge 运行而漂移）。
# 生成：2026-07-15 由 LLM 逐任务阅读 tasks/*.md（Prompt + Automated Checks）标注，
# 注：*_max/*_calls/*_attempts 等诊断计量键不入映射（聚合时也会被归一化规则排除）；
#     *_earned 键按 earned/max 比值归一；02 拼图任务为原始点数制，映射键用 overall_score。
#       键名与 round1 实测 score.json 检查点全集比对校验；新增/修改任务后需同步维护。

