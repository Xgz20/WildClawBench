# 本节按用户指定采用五维；上方已有任务的七维映射保持不变。
# 结构仍为 task_id -> checkpoint_key -> [能力标签]；题号与当前任务 ID 一致。
# 五维：intent_understanding 意图理解 / state_awareness 状态感知 /
#       reasoning_and_decision_making 推理与决策 / tool_invocation 工具调用 /
#       result_evaluation 结果评估。
