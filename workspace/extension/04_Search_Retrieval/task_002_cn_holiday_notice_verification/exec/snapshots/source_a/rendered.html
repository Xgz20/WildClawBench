    <h1>连续8天，费用全免！</h1>
    <p class="meta">2025-01-21 17:32 发布于：山西省</p>
    <p>根据《国务院办公厅关于2025年部分节假日安排的通知》要求，2025年春节放假调休日期的具体安排通知如下：</p>
    <p>春节放假安排：1月28日（农历除夕、周二）至2月4日（农历正月初七、周二）放假调休，共计8天。1月26日（周日）、2月8日（周六）上班。</p>
    <p>高速公路免费通行时间：1月28日（除夕）0时至2月4日（正月初七）24时，共计8天。高速公路将实施七座以下（含七座）小型客车免费通行的政策。</p>
